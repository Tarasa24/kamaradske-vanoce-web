.cta:hover,.cta:focus-visible{transform:scale(1.14)}
@media (prefers-reduced-motion:reduce){#envg.shake{animation:none}.cta{transition:none}}

<script>
(function(){
var html=document.documentElement,world=document.getElementById('world'),hot=document.getElementById('hot'),envg=document.getElementById('envg');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,opened=false;
html.classList.add('lock');
var SX=0.63080,SY=0.62784,TX=55.4072,TY=27.6690,FW=292.5*SX,FH=525*SY;
function cam(){var vw=innerWidth,vh=innerHeight,k=world.offsetWidth/292.5,L=world.offsetLeft,s=Math.min(vw/FW,vh/FH)/k;
 var cx=TX+FW/2,cy=TY+FH/2;return {s:s,x:vw/2-L-cx*k*s,y:vh/2-cy*k*s}}
function setCam(){if(opened)return;var c=cam();world.style.transform='translate('+c.x+'px,'+c.y+'px) scale('+c.s+')';}
setCam();addEventListener('resize',setCam);
function shake(){if(opened)return;envg.classList.remove('shake');void envg.getBoundingClientRect();envg.classList.add('shake');}
hot.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')shake()});
envg.addEventListener('animationend',function(){envg.classList.remove('shake')});
var hint=setInterval(function(){if(!opened&&matchMedia('(hover:none)').matches)shake()},4500);
function ease(el,prop,from,to,dur,delay,easing,fill){
 return el.animate([{[prop]:from},{[prop]:to}],{duration:reduce?1:dur,delay:reduce?0:delay,easing:easing||'ease',fill:'forwards'});}
function open(){
 if(opened)return;opened=true;try{sessionStorage.setItem('kv_open','1');localStorage.setItem('kv_open','1')}catch(e){}clearInterval(hint);envg.classList.remove('shake');hot.style.pointerEvents='none';
 html.classList.add('opened');
 var c=cam(),D=reduce?1:1;
 var pg=function(){};
 world.animate([{transform:world.style.transform},{transform:'translate(0px,0px) scale(1)'}],{duration:reduce?1:1000,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'}).finished.then(function(){world.style.transform='none'});
 document.getElementById('title').style.opacity=0;
 var T=reduce?0:1;
 setTimeout(function(){
  ease(document.getElementById('closedflap'),'transform','scaleY(1)','scaleY(0)',360,0,'ease-in');
  ease(document.getElementById('openflap'),'transform','scaleY(0)','scaleY(1)',360,330,'ease-out');
  setTimeout(function(){var r=document.getElementById('irect');r.setAttribute('y','0');r.setAttribute('height','246.4')},reduce?0:420);
 },reduce?0:450);
 setTimeout(function(){
  var a=ease(document.getElementById('letter'),'transform','translateY(300px)','translateY(0px)',1300,0,'cubic-bezier(.22,.8,.3,1)');
  a.finished.then(function(){html.classList.remove('lock');initText();});
 },reduce?0:1250);
}
hot.addEventListener('click',open);
hot.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
var tx=[].slice.call(document.querySelectorAll('.tx')),started=false;
var done={};try{done=JSON.parse(localStorage.getItem('kv_done')||'{}')}catch(e){}
function stat(im){return im.dataset.src.replace(/(^|\/)t(\d+)\.svg/,'$1s$2.svg')}
function fin(im,st,d){setTimeout(function(){var ok=function(){im.src=st.src;done[im.dataset.src]=1;try{localStorage.setItem('kv_done',JSON.stringify(done))}catch(e){}};(st.decode?st.decode().then(ok,ok):ok())},d)}
function play(im){var d=reduce?50:parseFloat(im.dataset.dur)*1000+300;
  if(done[im.dataset.src]){im.src=stat(im);return}
  var st=new Image();st.src=stat(im);
  im.onload=function(){im.onload=null;fin(im,st,d)};
  im.src=im.dataset.src+'?r='+Date.now();}
function initText(){
 if(started)return;started=true;
 function go(im){if(im._s)return;im._s=1;io.unobserve(im);
  if(!done[im.dataset.src]&&im.dataset.h&&!reduce)im.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)'}],{duration:parseFloat(im.dataset.dur)*1000-120,easing:'linear',fill:'both'});
  play(im)}
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)go(e.target)})},{rootMargin:'0px 0px -9% 0px',threshold:.1});
 tx.forEach(function(im){io.observe(im)});
 addEventListener('scroll',function(){if(innerHeight+scrollY>=document.documentElement.scrollHeight-6)tx.forEach(go)},{passive:true});
}

function openInstant(){
 opened=true;clearInterval(hint);hot.style.pointerEvents='none';html.classList.add('opened');html.classList.remove('lock');
 world.style.transform='none';document.getElementById('title').style.opacity=0;
 document.getElementById('closedflap').style.transform='scaleY(0)';document.getElementById('openflap').style.transform='scaleY(1)';
 var ir=document.getElementById('irect');ir.setAttribute('y','0');ir.setAttribute('height','246.4');document.getElementById('letter').style.transform='translateY(0px)';initText();
}
var was=false;try{was=localStorage.getItem('kv_open')==='1'||sessionStorage.getItem('kv_open')==='1'}catch(e){}
if(was||location.hash==='#otevrena')openInstant();
// předehřátí cache (animace se pak spustí hned po zobrazení)

})();
</script>
<button id="rst" aria-label="Spustit znovu" title="Spustit znovu" style="position:fixed;left:22px;bottom:24px;z-index:99;width:112px;padding:0;border:0;background:none;cursor:pointer"><img src="restart.svg" alt="Spustit znovu" style="width:100%;display:block;pointer-events:none"></button>
<script>document.getElementById('rst').onclick=function(){try{localStorage.removeItem('kv_open');localStorage.removeItem('kv_done');sessionStorage.removeItem('kv_open')}catch(e){}history.replaceState(null,'',location.pathname+location.search);location.reload()}</script>
