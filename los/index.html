<!DOCTYPE html>
<html lang="cs">

<script>(function(){var s=Math.min(screen.width,screen.height),w=Math.min(innerWidth,s);if((s<=820||w<=820)&&innerHeight>=innerWidth*0.99&&location.search.indexOf('pc')<0)location.replace('m.html'+location.hash)})()</script>

<title>Tajný Ježíšek</title>
<style>
html,body{margin:0;height:100%;background:#f2e9de;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;overflow:hidden;--ar:1.7786;
  width:min(100vw,calc(100vh * var(--ar)));width:min(100vw,calc(100dvh * var(--ar)));aspect-ratio:var(--ar);
  user-select:none;-webkit-user-select:none}
#stage img{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
#stage .el{position:absolute}
#stage .el>img{left:0;top:0;width:100%;height:100%}
#stage button.el,#stage a.el{padding:0;margin:0;border:0;background:transparent;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent;outline:none}
#stage button.el:focus-visible,#stage a.el:focus-visible{outline:3px solid #2c6552;outline-offset:4px;border-radius:14px}
.grow{transition:transform .22s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 50%}
@media (hover:hover){.grow:hover{transform:scale(1.12)}}
.grow:active{transform:scale(.97)}
#list{position:absolute;inset:0;transition:opacity .6s ease}
#list.off{opacity:0;pointer-events:none}
#list.lock button{pointer-events:none}
#doodles{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
#doodles.on{opacity:1}
.dd{animation:float var(--dur,8s) ease-in-out var(--del,0s) infinite alternate;will-change:transform}
@keyframes float{
  from{transform:translate3d(calc(var(--ax,0)*var(--u)*-1),calc(var(--amp,8)*var(--u)*-1),0) rotate(calc(var(--rot,1.5deg)*-1))}
  to{transform:translate3d(calc(var(--ax,0)*var(--u)),calc(var(--amp,8)*var(--u)),0) rotate(var(--rot,1.5deg))}}
#cardwrap{position:absolute;inset:0;visibility:hidden;transform-origin:50% 20%;filter:drop-shadow(0 .5vmin 1.2vmin rgba(60,40,20,.14))}
#cardwrap .fade{transition:opacity .35s ease;opacity:0}
#cardwrap .fade.on{opacity:1}
#confirmG,#drawG,#resultG,#backG{position:absolute;inset:0;pointer-events:none}
#confirmG>*,#backG>*{pointer-events:auto}
#drawG,#resultG{opacity:0;transition:opacity .45s ease}
#drawG.on,#resultG.on{opacity:1}
#confirmG{opacity:0;transition:opacity .4s ease}
#confirmG.on{opacity:1}
#backG{opacity:0;transition:opacity .8s ease;pointer-events:none}
#backG.on{opacity:1}
#backG.on>*{pointer-events:auto}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.86);opacity:.2}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.dd{animation:none}.pop{animation:none}.grow{transition:none}}
</style>
</head>
<body>
<div id="stage" role="main">
  <div id="list"></div>
  <div id="doodles" aria-hidden="true"></div>
  <div id="cardwrap">
    <img id="card" alt="">
    <div id="confirmG"></div>
    <div id="drawG"></div>
    <div id="resultG"></div>
    <div id="headG"></div>
    <div id="backG"></div>
  </div>
</div>
<script>
(function(){
  var NAMES=["Petr", "Klára", "Julie", "Jára", "Flori", "Máma", "Karolýna", "Jakub", "Aneta", "Štěpán"], DATA={"Aneta": "CwAnRoA=", "Jakub": "C7bqXYQ=", "Štěpán": "ERA/XQ==", "Flori": "ChQ5QImaOMP2", "Petr": "DLbqQoQ=", "Klára": "BxkkXYw=", "Jára": "ChmIjpc4", "Karolýna": "ABsuW4Q=", "Julie": "CxQgWoc=", "Máma": "hNU/634pRgz5"}, KEY_B64="QXVLL+VZha2XnBF14q2nQH4LmdmTTGpt", META={"nm0": [347.5, 169.75, 137.25, 43.0], "nm0_name": "Petr", "nm1": [358.25, 238.75, 111.0, 46.5], "nm1_name": "Flori", "nm2": [345.5, 320.0, 141.75, 41.5], "nm2_name": "Aneta", "nm3": [347.75, 399.0, 138.75, 43.0], "nm3_name": "Jára", "nm4": [332.25, 473.5, 159.5, 42.5], "nm4_name": "Štěpán", "nm5": [533.5, 175.25, 138.5, 43.0], "nm5_name": "Karolýna", "nm6": [518.5, 247.5, 159.25, 41.75], "nm6_name": "Julie", "nm7": [538.25, 318.75, 138.0, 42.75], "nm7_name": "Klára", "nm8": [549.25, 391.0, 120.75, 53.25], "nm8_name": "Máma", "nm9": [545.25, 473.5, 125.25, 48.75], "nm9_name": "Jakub", "lstatic": [301.5, 59.0, 421.5, 86.75], "card": [241.75, 67.25, 540.5, 386.0], "c_jsi": [449.25, 139.25, 126.5, 28.75], "c_no": [347.75, 327.75, 145.75, 30.75], "c_yes": [560.25, 312.75, 144.0, 57.5], "d_txt": [402.0, 139.25, 220.25, 237.0], "r_txt": [393.25, 139.25, 238.25, 242.0], "back": [372.25, 537.25, 280.25, 28.25], "dd": [["dd0", 323.5, 463.0, 46.5, 46.0], ["dd1", 197.5, 467.0, 63.0, 111.0], ["dd2", 132.0, 350.5, 109.5, 54.0], ["dd3", 18.0, 451.5, 143.5, 79.5], ["dd4", 780.5, 157.5, 51.0, 52.0], ["dd5", 571.5, 30.5, 22.5, 23.0], ["dd6", 612.0, 44.5, 171.0, 100.5], ["dd7", 841.0, -2.0, 53.0, 31.0], ["dd8", 175.5, -2.0, 176.5, 157.0], ["dd9", 688.5, 375.5, 155.5, 202.5], ["dd10", -2.0, 50.0, 186.0, 203.5], ["dd11", 922.5, 406.0, 61.0, 56.5], ["dd12", 885.5, 236.0, 140.5, 89.5], ["dd13", 994.5, 143.5, 31.5, 57.5]], "heads": {"Jára": {"tag": "0", "A": [110.75, 43.5, 67.75, 34.75], "B": [110.75, 43.5, 57.5, 34.75], "base": 73.25}, "Petr": {"tag": "1", "A": [108.75, 107.0, 75.25, 25.25], "B": [108.75, 107.5, 65.75, 23.75], "base": 129.375}, "Julie": {"tag": "2", "A": [105.0, 162.5, 79.25, 27.25], "B": [105.0, 164.0, 68.75, 25.75], "base": 185.0}, "Klára": {"tag": "3", "A": [102.75, 239.0, 87.25, 33.0], "B": [102.75, 239.0, 77.0, 31.75], "base": 268.75}, "Máma": {"tag": "4", "A": [102.5, 373.25, 86.5, 33.0], "B": [102.5, 373.25, 76.25, 31.25], "base": 402.875}, "Aneta": {"tag": "5", "A": [100.75, 422.25, 90.25, 25.25], "B": [100.75, 423.0, 80.25, 23.5], "base": 445.0}, "Jakub": {"tag": "6", "A": [100.75, 477.0, 87.5, 27.0], "B": [100.75, 478.0, 77.25, 26.0], "base": 499.5}, "Štěpán": {"tag": "7", "A": [95.0, 512.25, 102.5, 32.75], "B": [95.0, 512.25, 92.0, 32.5], "base": 542.5}, "Karolýna": {"tag": "8", "A": [80.25, 320.0, 139.0, 32.75], "B": [80.25, 320.0, 128.75, 31.75], "base": 349.875}, "Flori": {"tag": "f", "A": [437.25, 188.75, 151.0, 44.25], "B": [437.25, 191.0, 131.75, 40.0], "base": 228.25}}};
  var BACK_URL="../";
  var reduce=matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function reveal(name){var enc=atob(DATA[name]),key=atob(KEY_B64),b=new Uint8Array(enc.length);
    for(var i=0;i<enc.length;i++)b[i]=enc.charCodeAt(i)^key.charCodeAt(i%key.length);return new TextDecoder("utf-8").decode(b);}

  var stage=document.getElementById("stage"),list=document.getElementById("list"),dood=document.getElementById("doodles"),
      wrap=document.getElementById("cardwrap"),confirmG=document.getElementById("confirmG"),drawG=document.getElementById("drawG"),
      resultG=document.getElementById("resultG"),headG=document.getElementById("headG"),backG=document.getElementById("backG");
  var WIDE=[0,0,1024.5,576], NARROW=[232,0,560,576], win=WIDE;
  var reg=[];   // [element, vb]
  function pos(el,vb){reg.push([el,vb]);apply(el,vb);return el;}
  function apply(el,v){el.style.left=((v[0]-win[0])/win[2]*100)+"%";el.style.top=((v[1]-win[1])/win[3]*100)+"%";
    el.style.width=(v[2]/win[2]*100)+"%";el.style.height=(v[3]/win[3]*100)+"%";}
  function layout(){
    win=matchMedia("(min-aspect-ratio: 1/1)").matches?WIDE:NARROW;
    stage.style.setProperty("--ar",(win[2]/win[3]).toFixed(4));
    reg.forEach(function(r){apply(r[0],r[1]);});
    stage.style.setProperty("--u",(stage.clientWidth/win[2])+"px");
  }
  function mk(tag,cls,parent){var e=document.createElement(tag);if(cls)e.className=cls;if(parent)parent.appendChild(e);return e;}
  function imgEl(src,alt,parent){var i=mk("img",null,parent);i.src=src;i.alt=alt||"";i.draggable=false;return i;}
  // statická ilustrace na pozici vb (vb = [x,y,w,h] v jednotkách návrhu)
  function layer(key,parent,alt){var d=mk("div","el",parent);d.style.pointerEvents="none";imgEl(key+".svg",alt,d);return pos(d,META[key]);}
  function ctl(key,parent,label,fn,tag){var b=mk(tag||"button","el grow",parent);if(b.tagName==="BUTTON")b.type="button";
    b.setAttribute("aria-label",label);imgEl(key+".svg","",b);pos(b,META[key]);b.addEventListener("click",fn);return b;}

  // ---------- seznam jmen ----------
  layer("lstatic",list,"Tajný Ježíšek. Klikni na své jméno a zjisti, koho obdarováváš.");
  var nameBtn={};
  for(var i=0;i<10;i++){(function(i){var n=META["nm"+i+"_name"];nameBtn[n]=ctl("nm"+i,list,n,function(){ask(n);});})(i);}

  // ---------- karta ----------
  var card=document.getElementById("card");card.src="card.svg";card.style.pointerEvents="none";
  var cardBox=mk("div","el",null);cardBox.style.display="none";
  // card je <img> přímo ve wrapperu → umístíme ho přes pos
  pos(card,META.card);
  layer("c_jsi",confirmG,"Jsi opravdu");
  var yesB=ctl("c_yes",confirmG,"Ano, to jsem já",function(){yes();});
  var noB=ctl("c_no",confirmG,"Ne, zpět na seznam",function(){no();});
  layer("d_txt",drawG,"Losuju… ještě chvíli…");
  layer("r_txt",resultG,"Příjemce tvého daru je. Super! Tuhle informaci si nech pro sebe.");
  var backA=ctl("back",backG,"Zpět na výpis informací",function(){location.href=BACK_URL+"#otevrena";},"a");
  backA.href=BACK_URL;

  // ---------- nadpisy jmen (s otazníkem / bez) ----------
  var K=1.76, HEAD={};
  function headPlace(name,which){var m=META.heads[name],vb=m[which],k=name==="Flori"?1:K,cx=which==="A"?512:511.5,base=228.2;
    var w=vb[2]*k,h=vb[3]*k;return [cx-w/2,base-(m.base-vb[1])*k,w,h];}
  NAMES.forEach(function(n){var m=META.heads[n];
    var a=mk("img","",headG);a.src="h_"+m.tag+".svg";a.alt=n+"?";a.draggable=false;a.style.visibility="hidden";a.style.pointerEvents="none";pos(a,headPlace(n,"A"));
    var b=mk("img","",headG);b.src="n_"+m.tag+".svg";b.alt=n;b.draggable=false;b.style.visibility="hidden";b.style.pointerEvents="none";pos(b,headPlace(n,"B"));
    HEAD[n]={A:a,B:b};});
  function hideHeads(){NAMES.forEach(function(n){HEAD[n].A.style.visibility="hidden";HEAD[n].B.style.visibility="hidden";});}
  function showHead(n,w,popIt){hideHeads();var e=HEAD[n][w];e.style.visibility="visible";
    if(popIt&&!reduce){e.classList.remove("pop");void e.getBoundingClientRect();e.classList.add("pop");}}

  // ---------- ilustrace (plovou nahoru a dolů) ----------
  META.dd.forEach(function(d,i){var el=mk("div","el dd",dood);imgEl(d[0]+".svg","",el);pos(el,d.slice(1));
    var r=(Math.sin(i*12.9898)*43758.5453);r=r-Math.floor(r);var r2=(Math.sin(i*78.233)*12345.678);r2=r2-Math.floor(r2);
    el.style.setProperty("--dur",(6.5+r*4.5).toFixed(2)+"s");
    el.style.setProperty("--del",(-r2*10).toFixed(2)+"s");
    el.style.setProperty("--amp",(5+r2*7).toFixed(1));
    el.style.setProperty("--ax",(r*3).toFixed(1));
    el.style.setProperty("--rot",(1+r2*2.2).toFixed(2)+"deg");});

  // ---------- stav a animace ----------
  var selected=null,busy=false,state="list",anim=null;
  function on(el,v){el.classList.toggle("on",v);}
  function animateCard(kf,opt){if(anim){try{anim.cancel()}catch(e){}}
    if(reduce){opt.duration=1;}anim=wrap.animate(kf,opt);return anim;}
  function ask(n){
    if(busy||state!=="list")return;
    selected=n;state="confirm";
    hideHeads();showHead(n,"A",false);HEAD[n].A.style.visibility="hidden";
    list.classList.add("lock");
    on(confirmG,false);
    wrap.style.visibility="visible";
    var a=animateCard([
      {transform:"translateY(-104%) rotate(-5deg)",offset:0,easing:"cubic-bezier(.45,.05,.75,.6)"},
      {transform:"translateY(2.4%) rotate(1.7deg)",offset:.58,easing:"ease-out"},
      {transform:"translateY(-1.1%) rotate(-.7deg)",offset:.78,easing:"ease-in-out"},
      {transform:"translateY(0) rotate(0deg)",offset:1}],{duration:1050,fill:"forwards"});
    var done=function(){if(state!=="confirm"||selected!==n)return;showHead(n,"A",true);on(confirmG,true);};
    setTimeout(done,reduce?0:700);
  }
  function no(){
    if(state!=="confirm")return;state="list";selected=null;
    on(confirmG,false);hideHeads();
    var a=animateCard([{transform:"translateY(0) rotate(0deg)"},{transform:"translateY(-106%) rotate(3.5deg)"}],{duration:650,easing:"cubic-bezier(.5,0,.8,.4)",fill:"forwards"});
    a.onfinish=function(){if(state==="list"){wrap.style.visibility="hidden";list.classList.remove("lock");}};
  }
  function yes(){
    if(state!=="confirm"||!selected)return;
    state="draw";busy=true;var me=selected;
    on(confirmG,false);
    list.classList.add("off");on(dood,true);on(backG,true);
    setTimeout(function(){hideHeads();on(drawG,true);reel(me);},reduce?0:380);
  }
  function reel(me){
    var target=reveal(me),pool=NAMES.filter(function(n){return n!==me;}),total=reduce?600:7500,start=Date.now(),last="";
    (function tick(){
      var t=(Date.now()-start)/total;
      if(t>=1){finish();return;}
      var p;do{p=pool[Math.floor(Math.random()*pool.length)];}while(p===last&&pool.length>1);
      last=p;showHead(p,"B",false);
      setTimeout(tick,70+330*t*t);
    })();
    function finish(){
      showHead(target,"B",true);
      setTimeout(function(){on(drawG,false);on(resultG,true);state="result";},reduce?0:350);
    }
  }
  document.addEventListener("keydown",function(e){if(e.key==="Escape")no();});
  addEventListener("resize",layout);layout();
})();
</script>
<script>addEventListener('pageshow',function(e){if(e.persisted)location.reload()})</script></body>
